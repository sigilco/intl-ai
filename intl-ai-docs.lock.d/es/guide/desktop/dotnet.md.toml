[entries."h:f214e10c922e"]
value = 'El destino `IntlAiFill` se ejecuta antes de cada compilación, invocando la CLI para rellenar las traducciones faltantes. Debido a que los elementos `Resources\*.json` usan `CopyToOutputDirectory=PreserveNewest`, los archivos generados se copian automáticamente a la carpeta de salida.'
