[entries."h:76a6ada6561c"]
value = "Anthropic, Google, Azure OpenAI, Cohere, Mistral y otros exponen superficies compatibles con OpenAI (de primera parte o a través de un proxy). Apunta `base_url` al tuyo y configura `model` en consecuencia. Para una API con una forma de cable diferente, usa el proveedor `command` para ejecutar un agente local en su lugar; consulte [Proveedores](/guide/providers/)."
source_hash = "76a6ada6561c02fd68516e77f78827f096bd7daa"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-09T15:34:40Z"

[entries."h:7e4ac4e64a24"]
value = """
[OpenRouter](https://openrouter.ai) te da una clave API para muchos proveedores y un tier gratuito.
Un modelo gratuito estable en el momento de la escritura es `google/gemini-2.0-flash-exp:free`.
Si deja de funcionar, consulta la lista de modelos gratuitos de OpenRouter y actualiza esta única referencia."""
