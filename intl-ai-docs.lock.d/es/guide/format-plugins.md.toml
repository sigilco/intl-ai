[entries."h:8027c2f652f9"]
value = '[`examples/formats/strings-xml`](https://github.com/sigilco/intl-ai/tree/develop/examples/formats/strings-xml) es un plugin de referencia: un solo script de la biblioteca estándar de Python que lee y escribe un subconjunto mínimo de `strings.xml` de Android. Dado que las claves de strings.xml son planas, aplana el corpus anidado en nombres con puntos al escribir (`nav.home` -> `<string name="nav.home">`); un plugin puede en cambio devolver objetos anidados para preservar la agrupación.'
