[entries."h:5ffb33850418"]
value = "`[[formats]] exec` solo puede aparecer en el `intl-ai.toml` raíz, nunca en un archivo cargado mediante `extends`. Este es el mismo límite de confianza que `[[checks]] exec`: una configuración base proporcionada por una dependencia no debe registrar programas para ejecutar en tu máquina."
source_hash = "5ffb33850418806c4b84ae1e34e347b6e6d8fd18"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-09T15:51:51Z"

[entries."h:6685500b5ba3"]
value = "La resolución es inalterada: la extensión propia de un archivo existente gana, y el `format` configurado solo emite nuevos archivos. Un proyecto que mezcle `en.json`, `fr.yaml` y `de.xml` en un solo `locale_dir` lee cada archivo con el formato que reclamó su extensión."
