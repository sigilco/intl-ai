[entries."h:d5d1f63e202a"]
value = "intl-ai incluye formatos de locale JSON y YAML integrados. Una entrada `[[formats]]` registra un formato personalizado respaldado por un programa externo, por lo que cualquier formato de archivo (Android `strings.xml`, ARB, PO, `.strings`) puede funcionar con `intl-ai fill` y `intl-ai check` en cualquier lenguaje de implementación, sin enlazar Rust."
source_hash = "d5d1f63e202aa5a69ecc355cd535354f11d433bd"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-09T15:51:51Z"

[entries."h:e57c3522bec5"]
value = "Añade la entrada a `intl-ai.toml`, luego verifica con `intl-ai check` (lee todos los archivos de locale) y `intl-ai fill` (emite los que faltan)."
source_hash = "e57c3522bec5993e0fbcb5253986c4f09b82d38a"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-09T15:51:51Z"

