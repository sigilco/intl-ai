[entries."h:eaba18f00a87"]
value = "El plugin es una transformación pura entre el texto del archivo y el árbol del corpus (un objeto JSON de clave anidada -> cadena). intl-ai posee toda la E/S de archivos: lee el archivo, entrega el texto al plugin y escribe el texto devuelto de forma atómica. El plugin nunca toca el sistema de archivos."
