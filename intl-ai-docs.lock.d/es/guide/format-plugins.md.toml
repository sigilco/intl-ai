[entries."h:bd461119abb5"]
value = "Un proceso hijo por operación. stdin recibe exactamente una línea de solicitud JSONL; stdout debe producir exactamente una línea de respuesta JSONL. Ambas partes son estrictas con `v`: intl-ai envía `v: 1` y exige `v: 1` de vuelta, y un plugin que reciba un `v` que no admite debe responder con una respuesta `error`."
source_hash = "bd461119abb51d8e543d9e980efe90a440a495fd"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-09T15:51:51Z"

