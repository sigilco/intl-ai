[entries."h:f8219387216c"]
value = '¿Necesitas instrumentación por ejecución dentro del pipeline (publicar en Sentry, emitir una métrica, añadir a un registro)? Escribe una comprobación `exec`: el binario envía una solicitud JSONL por cada lote de claves y espera una respuesta JSONL con los resultados. Es un punto natural para "ejecutar esto en cada ejecución de comprobación" sin bifurcar el pipeline.'
source_hash = "f8219387216c36d837babb5c35b7480e04adec6d"
origin = "ai"
