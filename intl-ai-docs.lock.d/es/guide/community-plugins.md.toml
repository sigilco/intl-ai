[entries."h:cd6387b549d6"]
value = "**Locate the binary.** Para paquetes de npm, depende del paquete `intl-ai` (instala el binario de plataforma en postinstall) y resuélvelo como [`@intl-ai/unplugin` lo hace](https://github.com/sigilco/intl-ai/blob/develop/packages/unplugin/src/run.ts): opción `bin`, entorno `INTL_AI_BIN`, el paquete de npm, luego `PATH`. Fuera de npm, documenta los canales de instalación (script de instalación, brew, mise) y resuelve el binario de la misma manera."
source_hash = "cd6387b549d6b1defbc97880e571c21480af95a5"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-09T16:15:35Z"

[entries."h:e0164389b1b0"]
value = "**Soportado por la comunidad**: todo lo demás, mantenido por su autor. Un paquete `intl_ai` para Flutter en pub.dev, una tarea de Gradle, un script de fase de compilación de Xcode, un plugin de WordPress o Rails, un envoltorio Metro: todos son bienvenidos. Revisamos y enlazamos aquí y en el README, pero son propiedad de sus autores para correcciones y lanzamientos."
