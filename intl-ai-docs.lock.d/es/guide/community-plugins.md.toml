[entries."h:f4fd2167dc42"]
value = "Abre un PR que agregue tu integración a esta página y a la sección de la comunidad del README, con una descripción de una línea, comando de instalación y enlace al repositorio. Requisitos: código abierto, mantenido (commits recientes), y el shim delega al binario `intl-ai` en lugar de reimplementar fill o chequeos."
source_hash = "f4fd2167dc425616a0e78efa8d249e18e8966db7"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-09T16:15:35Z"

[entries."h:feb4aa862b8c"]
value = "El contrato de intl-ai es pequeño: una pila ejecuta `intl-ai fill` en el punto del ciclo de vida donde deben existir las traducciones, y opcionalmente `intl-ai check --fail-on` como puerta. Todo lo demás (qué herramienta de construcción, qué biblioteca i18n, qué idioma) es intercambiable. Eso hace que las integraciones mantenidas por la comunidad sean una combinación natural."
source_hash = "feb4aa862b8c895b8f36885c3f95429e3fd78e7b"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-09T16:15:35Z"
