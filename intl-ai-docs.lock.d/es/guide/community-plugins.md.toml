[entries."h:413916538a98"]
value = "**Exponer los controles de calidad.** Mapea la superficie de calidad de la CLI a las convenciones de tu plataforma: la puerta `[fill].validate`, umbral `judge` mediante `--judge-threshold`, severidades `--fail-on`, y un opt-out de desarrollo. No reimplementes la validación en el shim; siempre delega en el binario."
source_hash = "413916538a989203b864f4a7b7c566ffc9d4b5e5"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-09T16:09:55Z"

