[entries."h:45374ff55dc9"]
value = "El contrato se valida frente a un esquema JSON publicado disponible en `https://intl-ai.illo.fyi/schema/v1.json` (`intl-ai config schema` imprime el mismo esquema)."
source_hash = "45374ff55dc99b7fda5aab7450019a5a9abe3791"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-09T20:06:09Z"

[entries."h:454f86753c3e"]
value = "El formato del archivo local para nuevos archivos es: `json` (predeterminado), `yaml`, o un nombre de `[[formats]]`. La extensión propia de un archivo existente siempre prevalece, por lo que los directorios mixtos funcionan. Los nombres desconocidos no superan la validación."
source_hash = "454f86753c3e1b59cd2ffce49e2ac1c290962027"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-09T20:06:09Z"

[entries."h:4796d5840817"]
value = "Configurar configuraciones: una configuración raíz puede extender una base (lista o ruta única). Los archivos extendidos no pueden definir `provider.command`, comprobaciones de `exec` o formatos de `exec`: los archivos de datos de una dependencia no deben iniciar programas."
source_hash = "4796d5840817fb6ad3e93d5d0a623644d2e9e56c"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-09T20:06:09Z"

[entries."h:49e718049444"]
value = "La puerta de entrada shift-left: estas comprobaciones se ejecutan dentro de `fill` entre la traducción y la adopción. Solo las comprobaciones que permiten comentarios son válidas (`icu`, `placeholder-parity`, `judge`). Las claves que no superan la comprobación obtienen una ronda de corrección; las claves no resueltas se adoptan de todos modos, se registran en `quality.unresolved` en el archivo de bloqueo y `check` sigue marcándolas. Anula por ejecución con `--validate`/`--no-validate`."
source_hash = "49e718049444b472a01f3bf0534dc0eaab1b39c6"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-09T20:06:09Z"

