[entries."h:779d7eb2c142"]
value = 'IDs integrados: `icu`, `placeholder-parity`, `dialect:<locale>`, `judge`. Una entrada de comprobación también puede apuntar a una especificación YAML declarativa (`spec = "checks/brand.yaml"`) o a un comando externo (`exec = "./my-check"` con `args`/`cwd`/`timeout_ms`/`max_stdout_bytes`, solo config raíz). `threshold` es solo para el juez (puntuación por debajo de él se convierte en un hallazgo `invalid`, por defecto `0.8`); `weight` alimenta el agregado `[quality]`.'
