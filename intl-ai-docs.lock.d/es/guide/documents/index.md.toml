[entries."h:6d4bc2ebb6fe"]
value = "`intl-ai-docs` es un segundo binario que se incluye con cada instalación de `intl-ai`. Traduce los árboles de documentos completos (markdown y MDX) de la misma manera que `intl-ai` traduce los archivos de configuración regional: un árbol de origen en un idioma, un árbol generado por cada configuración regional de destino y un archivo de bloqueo que registra de dónde proviene cada cosa."
source_hash = "6d4bc2ebb6feee24de0651a238ca5c5435d77e28"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-12T17:43:12Z"

[entries."h:81a023b7412f"]
value = "Los modelos a veces traducen dentro del código en línea aunque no deberían. Déjalo claro en `locale_instructions`, por ejemplo: `Never translate text inside backticks; keep code blocks, commands, and identifiers verbatim.`"
source_hash = "81a023b7412fca8e3524c9a0c9a594fa92244fe8"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-12T17:43:12Z"

[entries."h:8277c7407fdb"]
value = "En lugar de claves y valores, `intl-ai-docs` divide cada documento en un **esqueleto** y **segmentos**:"
