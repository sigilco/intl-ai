[entries."h:2363dd1dfe42"]
value = "Los documentos traducidos se almacenan en `docs/<locale>/` reflejando el árbol fuente. La procedencia se guarda en fragmentos de `intl-ai-docs.lock.d/<locale>/<doc>.toml` con los mismos campos que el archivo de bloqueo del corpus (`origin`, `sourceHash`, `reviewed`, `quality`). Confirma tanto los árboles como los fragmentos."
source_hash = "2363dd1dfe42c60028e46b0acfcd326420888d39"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-12T17:41:42Z"

