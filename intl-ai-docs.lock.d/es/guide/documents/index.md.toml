origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-12T17:43:12Z"

[entries."h:82e54313e779"]
value = "Agregue una entrada `[locale_instructions]` por configuración regional para dirigir la terminología, el dialecto y el registro; la regla de resolución es la misma que la de `intl-ai` (configuración regional exacta, subtag de idioma, luego `*`)."
