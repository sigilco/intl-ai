[entries."h:4c9363a22f75"]
value = "El soporte para documentos es opcional. Cada comando `intl-ai-docs` se rechaza a ejecutarse a menos que tu configuración establezca `experimental = true`. El lector MDX maneja las construcciones que utilizan los sitios de documentación reales (frontmatter, cercas de código, callouts, bloques JSX), pero el formato es nuevo: ejecuta `intl-ai-docs check` en CI antes de publicar."
source_hash = "4c9363a22f75191594732577378d1f4f75464fe8"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-12T17:42:28Z"

