[entries."h:3157d259c179"]
value = "`intl-ai-docs.lock.d/` se sitúa junto al archivo de configuración. Cada documento traducido tiene un shard en `intl-ai-docs.lock.d/<locale>/<relpath>.toml` con `sourceHash`, `origin` (`ai` o `human`), `reviewed` y `quality` por segmento. También vive ahí un `check-cache.json` incremental; añádelo a gitignore."
