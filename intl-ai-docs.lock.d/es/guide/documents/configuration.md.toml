[entries."h:261f0613f941"]
value = "`intl-ai-docs` lee su propio archivo de configuración, `intl-ai-docs.toml` (o `.json`/`.yaml`), que se descubre recorriendo hacia arriba desde el directorio de trabajo. Colócalo junto al árbol de documentos que gestiona; está deliberadamente separado de `intl-ai.toml` para que los pipelines de catálogos y de documentos nunca compartan ajustes."
