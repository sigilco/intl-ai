[entries."h:5751fbc9ed8e"]
value = "`[check]` lleva las mismas opciones que el check de corpus: `fail_on` (tipos de hallazgo que salen con código distinto de cero, por defecto `missing`, `stale`, `invalid`) y `cache` (caché incremental de hallazgos, por defecto `true`). `[[checks]]` añade entradas estilo corpus spec/exec/judge además de los builtins de documento siempre activos, que verifican la paridad del esqueleto, las regiones protegidas, los prefijos de enlaces y la consistencia del rekey."
source_hash = "5751fbc9ed8e62d44703157bc0978d7f87eee9e0"
origin = "human"
reviewed = false
updated_at = "2026-10-12T18:41:59Z"

