[entries."h:6578fb865474"]
value = "intl-ai se ejecuta en tiempo de compilación mediante `@intl-ai/unplugin`, un delgado shim que genera el binario `intl-ai` (instalado automáticamente como una dependencia; consulte [Getting started](/guide/getting-started/) para otros canales de instalación y la configuración de `intl-ai.toml`). Admite todos los empaquetadores principales a través de [unjs/unplugin](https://github.com/unjs/unplugin). Elija su empaquetador a continuación."
