[entries."h:27088ac76acc"]
value = "No se requieren cambios en el código de tu aplicación. `intl-ai fill` se ejecuta mientras Next.js evalúa la configuración, antes de que el empaquetador comience, por lo que las traducciones se obtienen en tiempo de compilación sin sobrecarga en tiempo de ejecución."
source_hash = "27088ac76acc451790ae3e804f07084b367195d7"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-09T15:36:56Z"

[entries."h:3a76e0e94395"]
value = "`@intl-ai/next` envuelve tu `next.config` para que el binario `intl-ai` ejecute `fill` antes de que comience la compilación. Funciona con ambos empaquetadores de Next.js, webpack y Turbopack; consulta la [documentación de Next.js sobre Turbopack](https://nextjs.org/docs/app/api-reference/config/next-config-js/turbopack) para saber cuál usa tu versión. Versión mínima compatible: Next.js 14+."
source_hash = "3a76e0e94395188b0cd0178c799fb0d97665e9a0"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-09T15:36:56Z"

