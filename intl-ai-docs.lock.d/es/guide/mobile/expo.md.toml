[entries."h:fe201d481d35"]
value = "`@intl-ai/expo` es un plugin de configuración que ejecuta el binario `intl-ai` mientras Expo evalúa los plugins de configuración durante `expo prebuild`, `eas build` y `expo run:*`. Las traducciones se escriben en disco antes de que Metro empaquete tu aplicación, por lo que no hay ninguna sobrecarga en tiempo de ejecución."
source_hash = "fe201d481d35ee8038310d23212ad675333e8a3d"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-09T20:15:16Z"
