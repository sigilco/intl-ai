[entries."h:f0d9bb64f013"]
value = "Cada llamada es síncrona y bloqueante: `fill` realiza E/S del proveedor. Envía las llamadas fuera del hilo principal (un `Task.detached`, una `DispatchQueue` en segundo plano o un actor dedicado). Los errores aparecen como `IntlAiError` con un `kind` que coincide con la taxonomía de errores de la CLI."
source_hash = "f0d9bb64f01319a61f91c3fc2f1e5f29bfdb2d08"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-09T16:47:22Z"

