[entries."h:858278cda76a"]
value = "`IntlAi` lee el mismo `intl-ai.toml` que usa la CLI. `fill` escribe los archivos de configuración de idioma traducidos y fragmentos de lockfile, por lo que `locale_dir` debe apuntar a un directorio escribible como `filesDir`; copie la configuración y las configuraciones de idioma de origen allí en el primer lanzamiento. Para ejecuciones de solo lectura de `check` y `status`, los archivos en assets también funcionan. Cuando no incluye un archivo de configuración, `IntlAi.fromConfigString(config, ConfigFormat.TOML, workingDir)` construye una de forma inline."
source_hash = "858278cda76a745dfd757bbaf53cebc2946bda49"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-09T16:46:36Z"

