[entries."h:1565f189fcf1"]
value = "La integración de Flutter se proporciona como un constructor autoconteniendo [`build_runner`](https://pub.dev/packages/build_runner) en [`examples/flutter/plugin`](https://github.com/sigilco/intl-ai/tree/main/examples/flutter/plugin). Ejecuta `intl-ai fill` durante `flutter pub run build_runner build` y tiene una sobrecarga de tiempo de ejecución cero porque todas las traducciones se escriben en disco antes de que la aplicación Flutter sea empaquetada."
source_hash = "1565f189fcf1cf9ebf309c5b31a90a0617ab4741"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-09T16:44:47Z"

[entries."h:17ead36712eb"]
value = "El constructor se registra en el activo `$package$` y escribe un archivo marcador `intl-ai.done`. Cuando `build_runner` se ejecuta, invoca la CLI de `intl-ai` una vez por paquete. Agrega `intl-ai.done` a tu `.gitignore`; solo se utiliza para realizar el seguimiento de la finalización de la compilación."
source_hash = "17ead36712ebcc184b015021464d113f3be5f0c1"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-09T16:44:47Z"

