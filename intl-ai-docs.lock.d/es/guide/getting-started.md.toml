[entries."h:1d34bb8d6475"]
value = "Fill es aditivo por defecto: escribe solo las claves faltantes y nunca toca los valores existentes, ya sean escritos a mano o generados previamente. Los archivos de localización objetivo aparecen junto a tu fuente, y `intl-ai.lock.d/` registra el origen de cada clave (`ai` o `human`), el hash de origen y el estado de revisión. Commitea ambos."
