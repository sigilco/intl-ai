[entries."h:b8846ff67a34"]
value = "intl-ai se asocia con la biblioteca i18n que ya usas en lugar de tu bundler: apunta `locale_dir` al directorio que lee la biblioteca, luego traduce en el gancho de ciclo de vida que tu stack proporciona. Para stacks JS/TS los shims asignados hacen esto por ti: `@intl-ai/unplugin` (Vite, Webpack, Rollup, esbuild, Rspack, Farm), `@intl-ai/next` para Next.js, y `@intl-ai/expo` para React Native/Expo. En otros stacks, ejecuta directamente `intl-ai fill` (un script `prebuild` de npm, una fase de compilación Gradle o Xcode, ordenación `flutter gen-l10n`, y así sucesivamente)."
source_hash = "b8846ff67a34a5c77bcd757fbfd0255d4417cf83"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-09T15:58:50Z"

