[entries."h:9148e43f74a3"]
value = "Check es de solo lectura: informa sobre claves faltantes, obsoletas, inválidas, modificadas, extra y sin revisar. Usa `--fail-on missing,stale,invalid` en CI (código de salida 10 en hallazgos) y `--format json` para salida legible por máquina."
