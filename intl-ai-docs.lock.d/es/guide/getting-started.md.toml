[entries."h:52064249d74b"]
value = "intl-ai solo emite y valida [ICU MessageFormat](https://unicode-org.github.io/icu/userguide/format_parse/messages/) la sintaxis: `{name}` placeholders, `plural`/`select`/`selectordinal` con un brazo `other` requerido, `#` pound. Esta es una restricción dura, no un ajuste: es lo que permite que `check` y la compuerta de validación en tiempo de relleno detecten placeholders mangled. La sintaxis no ICU (printf `%s`, mustache `{{x}}`) está fuera de alcance."
source_hash = "52064249d74b284ca2064e5470a09ce9a514fd6b"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-09T15:58:50Z"

