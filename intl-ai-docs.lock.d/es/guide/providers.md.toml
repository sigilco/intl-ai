[entries."h:226bc6db348c"]
value = 'Todo transporte responde al mismo prompt: las claves aplanadas del locale de origen más instrucciones, términos del glosario y el contrato de marcador de posición (`processor = "icu"` exige ICU MessageFormat). La respuesta debe ser un objeto JSON de traducciones. `fill` lo analiza estrictamente; la comprobación `judge` puntúa la calidad a través del mismo transporte.'
