[entries."h:8027c2f652f9"]
value = '[`examples/formats/strings-xml`](https://github.com/sigilco/intl-ai/tree/develop/examples/formats/strings-xml) é um plugin de referência: um único script de biblioteca padrão Python que lê e escreve um subconjunto mínimo de Android `strings.xml`. Como as chaves de strings.xml são planas, ele achata o corpus aninhado em nomes pontuados na escrita (`nav.home` -> `<string name="nav.home">`); um plugin pode, em vez disso, retornar objetos aninhados para preservar o agrupamento.'
