[entries."h:bd461119abb5"]
value = "Um processo filho por operação. stdin recebe exatamente uma linha de solicitação JSONL; stdout deve produzir exatamente uma linha de resposta JSONL. Ambos os lados são rigorosos sobre `v`: o intl-ai envia `v: 1` e exige `v: 1` de volta, e um plugin que recebe um `v` que não suporta deve responder com uma resposta `error`."
source_hash = "bd461119abb51d8e543d9e980efe90a440a495fd"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-09T19:15:36Z"

