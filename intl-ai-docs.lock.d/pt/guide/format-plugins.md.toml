[entries."h:d5d1f63e202a"]
value = "intl-ai inclui formatos de locale JSON e YAML incorporados. Uma entrada `[[formats]]` regista um formato personalizado suportado por um programa externo, para que qualquer formato de ficheiro (Android `strings.xml`, ARB, PO, `.strings`) possa funcionar com `intl-ai fill` e `intl-ai check` em qualquer linguagem de implementação, sem ligar Rust."
source_hash = "d5d1f63e202aa5a69ecc355cd535354f11d433bd"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-09T19:16:09Z"

[entries."h:e57c3522bec5"]
value = "Adicione a entrada ao `intl-ai.toml`, depois verifique com `intl-ai check` (lê todos os ficheiros de locale) e `intl-ai fill` (cria os que faltam)."
source_hash = "e57c3522bec5993e0fbcb5253986c4f09b82d38a"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-09T19:16:09Z"

[entries."h:e59e0b282d11"]
value = "`content` é o texto completo do ficheiro; intl-ai escreve-o literalmente (ignorando a escrita quando os bytes não mudam)."
source_hash = "e59e0b282d1106a87a19de5575c02b5b659adc61"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-09T19:16:09Z"

[entries."h:eaba18f00a87"]
value = "O plugin é uma transformação pura entre o texto do ficheiro e a árvore do corpus (um objeto JSON de string de chained aninhada -> string). O intl-ai é proprietário de toda a E/S de ficheiros: lê o ficheiro, passa o texto para o plugin e escreve o texto retornado de forma atómica. O plugin nunca toca no sistema de ficheiros."
source_hash = "eaba18f00a8751273c0e332f9f35c0c092b7c769"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-09T19:16:09Z"

