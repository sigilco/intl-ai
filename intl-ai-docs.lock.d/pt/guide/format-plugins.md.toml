[entries."h:5ffb33850418"]
value = "`[[formats]] exec` só pode aparecer no `intl-ai.toml` raiz, nunca num ficheiro incluído via `extends`. Esta é a mesma fronteira de confiança que `[[checks]] exec`: uma configuração base fornecida por uma dependência não deve registar programas para correr na sua máquina."
source_hash = "5ffb33850418806c4b84ae1e34e347b6e6d8fd18"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-09T19:15:24Z"

[entries."h:6685500b5ba3"]
value = "A resolução não muda: a extensão própria de um ficheiro existente prevalece, e o `format` configurado só cria novos ficheiros. Um projeto que mistura `en.json`, `fr.yaml` e `de.xml` num único `locale_dir` lê cada ficheiro com o formato que reivindicou a sua extensão."
source_hash = "6685500b5ba332fa47943663289568e9be0286d5"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-09T19:15:24Z"

