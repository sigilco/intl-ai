[entries."h:2331de92c1c8"]
value = "O intl-ai 1.x substitui os pacotes TypeScript por um único binário Rust. Instale-o através do Homebrew, mise, do script de instalação ou do wrapper npm `intl-ai`; não é necessário Node.js para o executar. Os pacotes `@intl-ai/*` são apenas adaptadores (shims) que localizam e lançam o binário dentro da sua ferramenta de compilação."
source_hash = "2331de92c1c814415f72065844d663ee005334eb"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-09T17:48:29Z"

