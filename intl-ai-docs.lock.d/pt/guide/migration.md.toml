[entries."h:2a38953aecd4"]
value = "A versão 0.4.x escrevia a proveniência num único `intl-ai.lock.json`. A 1.x escreve ficheiros `intl-ai.lock.d/<locale>.toml` fragmentados. Não existe nenhum comando `intl-ai migrate`: as migrações são fornecidas como documentação que executa manualmente ou entrega a um agente. Na primeira execução, as chaves existentes nos seus ficheiros de localização são registadas como pertencentes a um humano: elas nunca são sobrescritas ou re-traduzidas. Apenas as chaves em falta recebem preenchimentos de IA. Isso significa que a migração prática é:"
source_hash = "2a38953aecd44c0ca0cb84c3ba244a6001982c43"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-09T17:48:29Z"

