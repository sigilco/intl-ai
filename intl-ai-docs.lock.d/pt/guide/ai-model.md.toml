[entries."h:76a6ada6561c"]
value = "Anthropic, Google, Azure OpenAI, Cohere, Mistral e outros expõem superfícies compatíveis com OpenAI (de primeira parte ou através de um proxy). Aponte `base_url` para o teu e defina `model` conforme necessário. Para uma API com uma forma de fio diferente, utilize o fornecedor `command` para executar um agente local em vez disso; veja [Providers](/guide/providers/)."
