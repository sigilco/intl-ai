[entries."h:6578fb865474"]
value = "O intl-ai é executado em tempo de compilação através do `@intl-ai/unplugin`, um thin shim que inicia o binário `intl-ai` (instalado automaticamente como dependência; consulte [Introdução](/guide/getting-started/) para outros canais de instalação e configuração do `intl-ai.toml`). Ele suporta todos os principais empacotadores através do [unjs/unplugin](https://github.com/unjs/unplugin). Escolha o seu empacotador abaixo."
