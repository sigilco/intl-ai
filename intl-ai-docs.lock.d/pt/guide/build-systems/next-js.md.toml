[entries."h:27088ac76acc"]
value = "Não são necessárias alterações no código da sua aplicação. O `intl-ai fill` é executado enquanto o Next.js avalia a configuração, antes do bundler iniciar, para que as traduções sejam aplicadas em tempo de compilação sem sobrecarga em tempo de execução."
source_hash = "27088ac76acc451790ae3e804f07084b367195d7"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-09T17:13:51Z"

[entries."h:3a76e0e94395"]
value = "O `@intl-ai/next` envolve o seu `next.config` para que o binário `intl-ai` execute o `fill` antes do início da compilação. Funciona com ambos os bundlers do Next.js, webpack e Turbopack; consulte a [documentação do Next.js sobre Turbopack](https://nextjs.org/docs/app/api-reference/config/next-config-js/turbopack) para saber qual o seu utiliza. Versão mínima suportada: Next.js 14+."
source_hash = "3a76e0e94395188b0cd0178c799fb0d97665e9a0"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-09T17:13:51Z"

