[entries."h:f214e10c922e"]
value = 'O destino `IntlAiFill` executa antes de cada construção, invocando a CLI para preencher as traduções em falta. Como os itens `Resources\*.json` utilizam `CopyToOutputDirectory=PreserveNewest`, os ficheiros gerados são copiados automaticamente para a pasta de saída.'
