[entries."h:261f0613f941"]
value = "O `intl-ai-docs` lê o seu próprio ficheiro de configuração, `intl-ai-docs.toml` (ou `.json`/`.yaml`), descoberto percorrendo para cima a partir do diretório de trabalho. Coloca-o junto da árvore de documentos que gere; está deliberadamente separado do `intl-ai.toml` para que os pipelines de catálogos e de documentos nunca partilhem definições."
