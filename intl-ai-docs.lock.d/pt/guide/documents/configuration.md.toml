[entries."h:5751fbc9ed8e"]
value = "`[check]` leva as mesmas opções do check de corpus: `fail_on` (tipos de achado que saem com código diferente de zero, por defeito `missing`, `stale`, `invalid`) e `cache` (cache incremental de achados, por defeito `true`). `[[checks]]` acrescenta entradas estilo corpus spec/exec/judge além dos builtins de documento sempre ativos, que verificam a paridade do esqueleto, as regiões protegidas, os prefixos de ligações e a consistência do rekey."
source_hash = "5751fbc9ed8e62d44703157bc0978d7f87eee9e0"
