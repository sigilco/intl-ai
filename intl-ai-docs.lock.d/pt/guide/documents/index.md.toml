[entries."h:2363dd1dfe42"]
value = "Documentos traduzidos ficam em `docs/<locale>/` espelhando a árvore de origem. A proveniência vive em `intl-ai-docs.lock.d/<locale>/<doc>.toml` shards com os mesmos campos do lockfile do corpus (`origin`, `sourceHash`, `reviewed`, `quality`). Faça commit tanto as árvores quanto os shards."
