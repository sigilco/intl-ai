[entries."h:4c9363a22f75"]
value = "O suporte a documentos é opcional. Todos os comandos `intl-ai-docs` recusam-se a executar a menos que a sua configuração defina `experimental = true`. O leitor MDX processa as construções que os sites de documentação reais usam (frontmatter, cercas de código, callouts, blocos JSX), mas o formato é novo: execute `intl-ai-docs check` no CI antes de publicar."
source_hash = "4c9363a22f75191594732577378d1f4f75464fe8"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-12T17:59:59Z"

