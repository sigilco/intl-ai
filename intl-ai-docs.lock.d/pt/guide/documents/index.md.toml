[entries."h:6d4bc2ebb6fe"]
value = "`intl-ai-docs` é um segundo binário que acompanha cada instalação de `intl-ai`. Ele traduz árvores de documentos completas (markdown e MDX) da mesma forma que `intl-ai` traduz ficheiros de locale: uma árvore fonte num único idioma, uma árvore gerada por locale de destino, e um ficheiro de bloqueio que regista de onde veio cada coisa."
source_hash = "6d4bc2ebb6feee24de0651a238ca5c5435d77e28"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-12T18:00:24Z"

[entries."h:81a023b7412f"]
value = "Os modelos por vezes traduzem dentro de código inline mesmo não devendo. Escreva-o explicitamente em `locale_instructions`, por exemplo: `Never translate text inside backticks; keep code blocks, commands, and identifiers verbatim.`"
source_hash = "81a023b7412fca8e3524c9a0c9a594fa92244fe8"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-12T18:00:24Z"

