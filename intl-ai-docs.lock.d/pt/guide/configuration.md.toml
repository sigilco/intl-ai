[entries."h:779d7eb2c142"]
value = 'Builtin ids: `icu`, `placeholder-parity`, `dialect:<locale>`, `judge`. Uma entrada de verificação também pode apontar para uma especificação YAML declarativa (`spec = "checks/brand.yaml"`) ou para um comando externo (`exec = "./my-check"` com `args`/`cwd`/`timeout_ms`/`max_stdout_bytes`, apenas config raiz). `threshold` é apenas do juiz (pontuação abaixo dele se torna uma descoberta `invalid`, padrão `0.8`); `weight` alimenta o agregado `[quality]`.'
source_hash = "779d7eb2c142edcdc4c1c9a257efd9dfe4f49843"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-09T19:11:16Z"

