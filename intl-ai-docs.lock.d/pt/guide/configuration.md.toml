updated_at = "2026-10-09T19:09:14Z"

[entries."h:49e718049444"]
value = "A porta shift-left: estas verificações correm dentro do `fill` entre tradução e adoção. Apenas verificações elegíveis para feedback qualificam (`icu`, `placeholder-parity`, `judge`). Chaves falhas recebem uma rodada corretiva; chaves não resolvidas são adotadas de qualquer forma, gravadas sob `quality.unresolved` no lockfile, e `check` continua a sinalizá-las. Substitua por execução com `--validate`/`--no-validate`."
source_hash = "49e718049444b472a01f3bf0534dc0eaab1b39c6"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-09T19:09:14Z"

