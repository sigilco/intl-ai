[entries."h:b8846ff67a34"]
value = "intl-ai combina com a biblioteca i18n que você já usa, em vez do seu bundler: aponte `locale_dir` para o diretório que a biblioteca lê e traduza no hook de ciclo de vida que sua pilha fornece. Para pilhas JS/TS, os shims nomeados fazem isso para você: `@intl-ai/unplugin` (Vite, Webpack, Rollup, esbuild, Rspack, Farm), `@intl-ai/next` para Next.js e `@intl-ai/expo` para React Native/Expo. Em outras pilhas, execute `intl-ai fill` diretamente (um script `prebuild` npm, uma fase de build Gradle ou Xcode, a ordem de `flutter gen-l10n`, e assim por diante)."
source_hash = "b8846ff67a34a5c77bcd757fbfd0255d4417cf83"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-09T17:39:39Z"

