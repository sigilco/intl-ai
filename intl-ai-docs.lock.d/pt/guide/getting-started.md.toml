[entries."h:9148e43f74a3"]
value = "Check é somente leitura: relata chaves ausentes, desatualizadas, inválidas, modificadas, extras e não revisadas. Use `--fail-on missing,stale,invalid` em CI (código de saída 10 em achados) e `--format json` para saída legível por máquina."
