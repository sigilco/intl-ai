[entries."h:1d34bb8d6475"]
value = "Preenchimento é aditivo por padrão: escreve apenas as chaves ausentes e nunca altera valores existentes, quer sejam escritos por humanos ou gerados anteriormente. Os arquivos de localização alvo aparecem ao lado do seu código‑fonte, e `intl-ai.lock.d/` shards registram a origem de cada chave (`ai` ou `human`), o hash da fonte e o estado de revisão. Commit ambos."
source_hash = "1d34bb8d64750c7599421be09bfae92bc3110b9a"
origin = "ai"
