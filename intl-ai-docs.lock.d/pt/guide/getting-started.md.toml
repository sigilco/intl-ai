[entries."h:52064249d74b"]
value = "intl-ai apenas emite e valida a sintaxe [ICU MessageFormat](https://unicode-org.github.io/icu/userguide/format_parse/messages/): placeholders `{name}`, `plural`/`select`/`selectordinal` com um braço `other` obrigatório, `#` pound. Esta é uma restrição rígida, não uma configuração: é o que permite que `check` e a validação em tempo de preenchimento detectem placeholders corrompidos. Sintaxe não-ICU (printf `%s`, mustache `{{x}}`) está fora de alcance."
source_hash = "52064249d74b284ca2064e5470a09ce9a514fd6b"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-09T17:39:39Z"

