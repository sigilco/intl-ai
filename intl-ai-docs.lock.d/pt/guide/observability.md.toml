[entries."h:f1039ef78706"]
value = "O binário `intl-ai` emite saída legível por máquina em cada comando. Não há uma API de callback para configurar: pipe `--format json` para o que você usar para telemetria, ou adicione um `exec` check para instrumentação personalizada."
