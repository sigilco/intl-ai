[entries."h:f8219387216c"]
value = 'Precisa de instrumentação por execução dentro do pipeline (postar no Sentry, emitir uma métrica, acrescentar a um log)? Escreva um `exec` check: o binário envia um pedido JSONL por lote de chaves e espera uma resposta JSONL com os resultados. É uma costura natural para "chamar isso em cada execução da verificação" sem fazer fork do pipeline.'
