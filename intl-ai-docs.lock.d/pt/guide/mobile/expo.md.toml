[entries."h:fe201d481d35"]
value = "`@intl-ai/expo` é um plugin de configuração que executa o binário `intl-ai` enquanto o Expo avalia plugins de configuração durante `expo prebuild`, `eas build` e `expo run:*`. As traduções são escritas em disco antes do Metro empacotar a sua aplicação, portanto não há sobrecarga em tempo de execução."
source_hash = "fe201d481d35ee8038310d23212ad675333e8a3d"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-09T21:17:41Z"
