[entries."h:1565f189fcf1"]
value = "A integração do Flutter é fornecida como um construtor autônomo [`build_runner`](https://pub.dev/packages/build_runner) em [`examples/flutter/plugin`](https://github.com/sigilco/intl-ai/tree/main/examples/flutter/plugin). Ele executa `intl-ai fill` durante `flutter pub run build_runner build` e não tem sobrecarga de tempo de execução porque todas as traduções são escritas no disco antes que o aplicativo Flutter seja empacotado."
source_hash = "1565f189fcf1cf9ebf309c5b31a90a0617ab4741"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-09T19:19:32Z"

[entries."h:17ead36712eb"]
value = "O construtor é registrado no ativo `$package$` e escreve um arquivo de marcador `intl-ai.done`. Quando o `build_runner` é executado, ele invoca a CLI `intl-ai` uma vez por pacote. Adicione `intl-ai.done` ao seu `.gitignore`; ele é usado apenas para rastrear a conclusão da compilação."
source_hash = "17ead36712ebcc184b015021464d113f3be5f0c1"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-09T19:19:32Z"

