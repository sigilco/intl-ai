[entries."h:858278cda76a"]
value = "`IntlAi` lê o mesmo `intl-ai.toml` que a CLI utiliza. `fill` escreve ficheiros de localização traduzidos e fragmentos de lockfile, por isso `locale_dir` deve apontar para um diretório gravável como `filesDir`; copie a configuração e as localizações de origem para lá no primeiro arranque. Para execuções de `check` e `status` apenas leitura, os ficheiros sob assets também funcionam. Quando não envia um ficheiro de configuração, `IntlAi.fromConfigString(config, ConfigFormat.TOML, workingDir)` cria uma inline."
source_hash = "858278cda76a745dfd757bbaf53cebc2946bda49"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-09T18:09:50Z"

