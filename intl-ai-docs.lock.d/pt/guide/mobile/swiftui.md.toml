[entries."h:f0d9bb64f013"]
value = "Toda chamada é síncrona e bloqueante: `fill` realiza I/O do fornecedor. Despache chamadas fora da thread principal (um `Task.detached`, uma `DispatchQueue` em segundo plano, ou um ator dedicado). Erros aparecem como `IntlAiError` com um `kind` que corresponde à taxonomia de erros da CLI."
source_hash = "f0d9bb64f01319a61f91c3fc2f1e5f29bfdb2d08"
origin = "ai"
