[entries."h:413916538a98"]
value = "**Exponha os controles de qualidade.** Mapeie a superfície de qualidade da CLI para as convenções da sua plataforma: a porta `[fill].validate`, limite de `judge` via `--judge-threshold`, severidades `--fail-on` e uma opção de desenvolvedor para desativar. Não reimplante a validação no shim; sempre delegue para o binário."
source_hash = "413916538a989203b864f4a7b7c566ffc9d4b5e5"
origin = "ai"
reviewed = false
model = "openrouter/free"
updated_at = "2026-10-09T17:23:35Z"

