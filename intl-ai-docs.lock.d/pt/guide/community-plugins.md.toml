[entries."h:f4fd2167dc42"]
value = "Open a PR that adds your integration to this page and the README's community section, with a one-line description, install command, and repo link. Requirements: open source, maintained (recent commits), and the shim delegates to the `intl-ai` binary rather than reimplementing fill or checks."
source_hash = "f4fd2167dc425616a0e78efa8d249e18e8966db7"
origin = "human"
reviewed = false
updated_at = "2026-10-09T19:08:03Z"

[entries."h:feb4aa862b8c"]
value = "intl-ai's contract is small: a stack runs `intl-ai fill` at the lifecycle point where translations should exist, and optionally `intl-ai check --fail-on` as a gate. Everything else (which build tool, which i18n library, which language) is interchangeable. That makes community-maintained integrations a natural fit."
source_hash = "feb4aa862b8c895b8f36885c3f95429e3fd78e7b"
origin = "human"
reviewed = false
updated_at = "2026-10-09T19:08:03Z"
