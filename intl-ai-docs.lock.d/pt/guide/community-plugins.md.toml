[entries."h:cd6387b549d6"]
value = "**Locate the binary.** For npm packages, depend on the `intl-ai` package (it installs the platform binary on postinstall) and resolve it like [`@intl-ai/unplugin` does](https://github.com/sigilco/intl-ai/blob/develop/packages/unplugin/src/run.ts): `bin` option, `INTL_AI_BIN` env, the npm package, then `PATH`. Outside npm, document the install channels (install script, brew, mise) and resolve the binary the same way."
source_hash = "cd6387b549d6b1defbc97880e571c21480af95a5"
origin = "human"
reviewed = false
updated_at = "2026-10-09T19:08:03Z"

[entries."h:e0164389b1b0"]
value = "**Community-supported**: everything else, maintained by its author. A Flutter `intl_ai` package on pub.dev, a Gradle task, an Xcode build-phase script, a WordPress or Rails plugin, a Metro wrapper: all are welcome. We review and link them here and in the README, but they are owned by their authors for fixes and releases."
source_hash = "e0164389b1b00915e0a91837e1015d56ba80462e"
origin = "human"
reviewed = false
updated_at = "2026-10-09T19:08:03Z"

