[entries."h:3382bb05788c"]
value = "**Spawn no ciclo de vida correto.** `intl-ai fill` onde as traduções devem existir (início da construção, pré-construção, pipeline de assets), mais `intl-ai check --fail-on <kinds>` se o shim atuar como uma barreira de construção."
