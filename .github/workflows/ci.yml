name: CI
on:
  push:
    branches: [develop, "release/*"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: "12.9.0"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: "12.9.0"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Rust JSON Schema drift check
        run: |
          ./target/debug/intl-ai config schema > docs/public/schema/intl-ai.schema.json
          cp docs/public/schema/intl-ai.schema.json docs/public/schema/v1.json
          git diff --exit-code docs/public/schema/

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Compile-check the wasm binding only; transports and fs-bound
      # modules stay excluded by feature flags.
      - run: cargo check -p intl-ai-wasm --target wasm32-unknown-unknown
      # demo/web ships a committed wasm-bindgen bundle (docs builds have
      # no Rust toolchain); regenerate it and fail on drift.
      - name: Install wasm-bindgen CLI matching Cargo.lock
        run: |
          ver=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep -m1 version | cut -d'"' -f2)
          curl -sL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${ver}/wasm-bindgen-${ver}-x86_64-unknown-linux-musl.tar.gz" | tar -xz
          install -m755 "wasm-bindgen-${ver}-x86_64-unknown-linux-musl/wasm-bindgen" "$HOME/.cargo/bin/"
      - name: wasm demo bundle freshness
        run: |
          demo/web/scripts/sync-wasm.sh
          git status --porcelain demo/web/src/lib/pkg/ | grep . && exit 1 || exit 0

  test:
    strategy:
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: "12.9.0"
      - uses: actions/setup-node@v6
        with:
          node-version: "${{ matrix.node }}"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
